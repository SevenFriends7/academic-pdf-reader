name: CI

# 每次推送到主分支或提 PR 时跑一遍：类型检查、单元测试、打包预检。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 单元测试（webview 侧）
        run: node scratch/llm-test/viewer-unit.js

      - name: 密钥泄露扫描
        run: node scratch/scan_secrets.js

      - name: 打包预检（确认发布清单里没有多余文件）
        run: npx --yes @vscode/vsce ls

      # 每次 CI 都产出一个可下载的 vsix：这样不用发布到商店也能让别人拿到安装包，
      # 也方便在别的机器上下载安装（Actions 运行页面底部 → Artifacts）。
      - name: 打包 VSIX
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: 上传 VSIX 产物
        uses: actions/upload-artifact@v4
        with:
          name: academic-pdf-reader-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 90
