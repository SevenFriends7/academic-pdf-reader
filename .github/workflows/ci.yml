name: CI

# 每次推送到主分支或提 PR 时跑一遍：类型检查、单元测试、打包预检。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 单元测试（webview 侧）
        run: node scratch/llm-test/viewer-unit.js

      # 静态检查未声明 / 重复声明的变量。
      # 实测抓到过一个潜伏很久的 bug：hoverTooltipTimer 从未声明，
      # 靠非严格模式的"隐式全局"侥幸运行，一旦在严格模式下执行就抛 ReferenceError。
      - name: 静态检查（no-undef / no-redeclare）
        run: npm run lint

      # 在真实 DOM（jsdom）里执行整个 viewer，并走一遍"打开文档 → 创建界面容器"的路径。
      # 假 DOM 测试会把"不存在则创建"的分支整段跳过，初始化的暂时性死区崩溃只能靠这一步发现。
      - name: 初始化冒烟测试（jsdom 真实 DOM）
        run: npm run test:init

      # 上面那步用的是**手写的简化 HTML**，并且刻意让 #aiAssistantModal 保持缺失，
      # 于是它测的是"viewer.js 自己造弹窗"这条路径——而真机上弹窗由宿主 HTML 提供，
      # 那条分支根本不执行。0.5.6~0.5.10 的"回答风格切换"就是这样连着四次"改了没生效"。
      # 这一步把宿主 HTML 抽出来跑真实路径，缺控件立刻红。
      - name: 宿主 HTML 冒烟测试（真实弹窗里的回答风格切换）
        run: npm run test:html

      - name: 密钥泄露扫描
        run: node scratch/scan_secrets.js

      - name: 版本纪律校验（CHANGELOG 章节 / 版本是否已发布）
        run: node scratch/check_version.js

      - name: 打包预检（确认发布清单里没有多余文件）
        run: npx --yes @vscode/vsce ls

      # 每次 CI 都产出一个可下载的 vsix：这样不用发布到商店也能让别人拿到安装包，
      # 也方便在别的机器上下载安装（Actions 运行页面底部 → Artifacts）。
      - name: 打包 VSIX
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: 上传 VSIX 产物
        uses: actions/upload-artifact@v4
        with:
          name: academic-pdf-reader-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 90
